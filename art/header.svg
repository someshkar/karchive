      <stop offset="0" stop-color="#1B1E25"/><stop offset="1" stop-color="#0E1014"/>
    </linearGradient>
    <linearGradient id="sign" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B7BFF"/><stop offset="1" stop-color="#1F56E0"/>
